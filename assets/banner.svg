<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Dynamic / Background Graphical Elements (Strictly kept in background/periphery) -->
  <g opacity="0.25">
    <!-- Pulse Line 1 -->
    <path d="M0,220 Q 200,180 400,230 T 800,190 T 1200,240" fill="none" stroke="#6366f1" stroke-width="3">
      <animate attributeName="d" 
               values="M0,220 Q 200,180 400,230 T 800,190 T 1200,240;
                       M0,200 Q 200,240 400,190 T 800,230 T 1200,200;
                       M0,220 Q 200,180 400,230 T 800,190 T 1200,240" 
               dur="10s" repeatCount="indefinite" />
    </path>
    <!-- Pulse Line 2 -->
    <path d="M0,80 Q 300,130 600,70 T 1200,100" fill="none" stroke="#ec4899" stroke-width="2">
      <animate attributeName="d" 
               values="M0,80 Q 300,130 600,70 T 1200,100;
                       M0,110 Q 300,60 600,120 T 1200,80;
                       M0,80 Q 300,130 600,70 T 1200,100" 
               dur="8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Floating Background Badges/Pills in Corners -->
  <g opacity="0.4">
    <rect x="50" y="40" width="140" height="32" rx="16" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1"/>
    <text x="120" y="61" fill="#818cf8" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">💼 SaaS Ecosystem</text>

    <rect x="1010" y="40" width="140" height="32" rx="16" fill="rgba(236, 72, 153, 0.2)" stroke="#ec4899" stroke-width="1"/>
    <text x="1080" y="61" fill="#f472b6" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Open Source</text>
    
    <rect x="1030" y="230" width="120" height="32" rx="16" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1"/>
    <text x="1090" y="251" fill="#c084fc" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 InsurTech</text>
  </g>

  <!-- Decorative Accent Bar -->
  <rect x="0" y="294" width="1200" height="6" fill="url(#accentGrad)" />

  <!-- Foreground Title and Subtitle (Crisp & Fully Visible) -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="135" fill="url(#textGrad)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="0.5">
      Awesome Broker Management System
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="180" fill="#94a3b8" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
      Curated Ecosystem of SaaS Platforms, Open-Source Tools &amp; InsurTech Solutions
    </text>

    <!-- Tagline Badges under Subtitle -->
    <g transform="translate(415, 205)">
      <rect x="0" y="0" width="110" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
      <text x="55" y="17" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">🛡️ Policy Admin</text>

      <rect x="125" y="0" width="120" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
      <text x="185" y="17" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">🏢 Agency AMS</text>

      <rect x="255" y="0" width="115" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
      <text x="312" y="17" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">💰 Commissions</text>
    </g>
  </g>
</svg>
